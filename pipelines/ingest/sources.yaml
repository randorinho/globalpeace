# Source registry — global coverage. Country attribution comes from the
# source's structured field when it has one, otherwise from full ISO-3166
# name matching (ingest/countries.py). Every source declares its confidence
# prior; ingested items are ALWAYS claims until the verification layer
# upgrades them.

sources:
  # ReliefWeb REST API, all countries in one query (primary_country.iso3 is
  # structured — no name matching involved). Requires a registered appname:
  # set RELIEFWEB_APPNAME once approved:
  # https://apidoc.reliefweb.int/parameters#appname
  # Until then this source errors and is skipped; the RSS feeds below carry on.
  - id: reliefweb-global
    kind: reliefweb
    confidence: 0.5      # institutional humanitarian reporting, still a claim
    limit: 50

  # UCDP GED — Uppsala's curated, human-coded conflict-event dataset.
  # Requires UCDP_API_TOKEN (infra/.env; x-ucdp-access-token header,
  # 5,000 requests/day). Releases are immutable snapshots, each walked ONCE
  # (marker in .state/): bump ucdp_version when Uppsala publishes the next
  # release (annual GED or monthly candidate) to pull it in. `since` bounds
  # the backfill — Dec 2025 alone is ~1.8k events, so widen it deliberately.
  - id: ucdp-ged
    kind: ucdp
    ucdp_version: "26.1"   # covers through 2025
    since: "2025-06-01"
    confidence: 0.8        # multi-source, human-coded academic dataset — still enters as a claim

  # ReliefWeb country feeds via RSS (PC<id> = primary-country taxonomy id).
  # Kept for the original pilot countries as priority coverage; the global
  # API source above supersedes them once RELIEFWEB_APPNAME is set.
  - id: reliefweb-sd
    kind: rss
    url: "https://reliefweb.int/updates/rss.xml?advanced-search=%28PC220%29"
    country: SD
    confidence: 0.5
    limit: 10

  - id: reliefweb-td
    kind: rss
    url: "https://reliefweb.int/updates/rss.xml?advanced-search=%28PC55%29"
    country: TD
    confidence: 0.5
    limit: 10

  - id: reliefweb-ss
    kind: rss
    url: "https://reliefweb.int/updates/rss.xml?advanced-search=%28PC8657%29"
    country: SS
    confidence: 0.5
    limit: 10

  - id: reliefweb-cd
    kind: rss
    url: "https://reliefweb.int/updates/rss.xml?advanced-search=%28PC75%29"
    country: CD
    confidence: 0.5
    limit: 10

  - id: reliefweb-ht
    kind: rss
    url: "https://reliefweb.int/updates/rss.xml?advanced-search=%28PC113%29"
    country: HT
    confidence: 0.5
    limit: 10

  # IOM (International Organization for Migration / UN Migration) — org feed
  # via ReliefWeb (iom.int blocks direct RSS). Covers displacement and migrant
  # casualties; items matched to countries by name (now global).
  - id: iom-reliefweb
    kind: rss
    url: "https://reliefweb.int/updates/rss.xml?advanced-search=%28S1255%29"
    confidence: 0.6
    limit: 20

  # Global headlines — no fixed country: items are matched against the full
  # country registry by name; items naming no country are skipped (logged),
  # never guessed.
  - id: reliefweb-headlines
    kind: rss
    url: "https://reliefweb.int/updates/rss.xml?view=headlines"
    confidence: 0.4
    limit: 20

  # UN News — open global feed, no key, no WAF. Country attribution by name
  # against the full registry. (ReliefWeb's site/RSS now sits behind an AWS
  # WAF browser challenge — HTTP 202 — so until RELIEFWEB_APPNAME is approved
  # for the API, this is the primary global source.)
  - id: un-news-all
    kind: rss
    url: "https://news.un.org/feed/subscribe/en/news/all/rss.xml"
    confidence: 0.5
    limit: 30
