# globalpeace.ai origin stack — local dev / single-host deployment.
# Exposed to the internet ONLY through Cloudflare Tunnel (cloudflared service).
name: gpai

services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_USER: gpai
      POSTGRES_PASSWORD: gpai
      POSTGRES_DB: gpai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpai"]
      interval: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/gpai-dev-password
    volumes:
      - neo4jdata:/data
    ports:
      - "127.0.0.1:7474:7474"   # browser
      - "127.0.0.1:7687:7687"   # bolt

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"   # dev only — enable security before any shared deployment
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - osdata:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"

  # Kafka-compatible broker (Redpanda: single binary, no ZooKeeper — see docs/ARCHITECTURE.md)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    volumes:
      - rpdata:/var/lib/redpanda/data
    ports:
      - "127.0.0.1:9092:9092"

  api:
    build: ../backend
    env_file: ../backend/.env.example
    environment:
      GPAI_DATABASE_URL: postgresql+asyncpg://gpai:gpai@postgres:5432/gpai
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # Cloudflare Tunnel — the ONLY public path to the origin.
  # Create the tunnel in Zero Trust → Networks → Tunnels, map
  # origin.globalpeace.ai → http://api:8000, then:
  #   TUNNEL_TOKEN=... docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}  # required when running the tunnel profile
    depends_on:
      - api

volumes:
  pgdata:
  neo4jdata:
  osdata:
  rpdata:
