[project]
name = "gpai-backend"
version = "0.1.0"
description = "globalpeace.ai origin API — events, verification, risk signals"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "geoalchemy2>=0.16",
    "pydantic-settings>=2.6",
    "shapely>=2.0",
    "httpx>=0.27",
    "neo4j>=5.0",
]

[tool.uv]
dev-dependencies = ["pytest>=8", "httpx>=0.27"]
